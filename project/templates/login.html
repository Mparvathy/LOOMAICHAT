<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loom - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 12% 8%, rgba(99,102,241,0.14), transparent 42%),
                radial-gradient(circle at 88% 92%, rgba(37,99,235,0.14), transparent 42%),
                linear-gradient(180deg, #f5f7fb 0%, #eef1fb 100%);
            color: #1e293b;
        }

        nav {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2vh 64px;
            flex-shrink: 0;
        }

        .nav-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #1e293b;
        }

        .nav-logo span {
            background: linear-gradient(90deg, #2563eb, #6366f1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #64748b;
        }

        .nav-links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        .nav-links a:hover { text-decoration: underline; }

        .wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 24px 40px 24px;
        }

        .card {
            width: 460px;
            max-width: 100%;
            background: white;
            border-radius: 20px;
            padding: 44px 40px;
            box-shadow: 0 20px 60px rgba(30, 41, 90, 0.10), 0 2px 8px rgba(30, 41, 90, 0.06);
            border: 1px solid rgba(37, 99, 235, 0.08);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #eff6ff;
            color: #2563eb;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.03em;
            padding: 5px 14px;
            border-radius: 999px;
            margin-bottom: 16px;
        }

        .card h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 26px;
            margin-bottom: 6px;
        }

        .card .sub {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .field { margin-bottom: 16px; }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: #475569;
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            padding: 12px 14px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            color: #1e293b;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .field input::placeholder { color: #94a3b8; }

        .field input:focus {
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .field input.field-error {
            border-color: #fca5a5;
            background: #fff5f5;
        }

        .message {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .message.show { display: block; }

        .message.error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
        }
        .message.success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #15803d;
        }

        button.submit {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
        }

        button.submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(37, 99, 235, 0.32);
        }
        button.submit:active { transform: translateY(0); }
        button.submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .foot {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }
        .foot a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }
        .foot a:hover { text-decoration: underline; }

        @media (max-width: 560px) {
            nav { padding: 20px 24px; }
            .card { padding: 32px 24px; }
        }
    </style>
</head>

<body>

<nav>
    <a href="/" class="nav-logo">🧵 <span>Loom</span></a>
    <div class="nav-links">
        Don't have an account? <a href="/register/">Register</a>
    </div>
</nav>

<div class="wrap">
    <div class="card">

        <div class="badge">✦ AI-POWERED</div>
        <h1>Welcome back</h1>
        <p class="sub">Sign in to continue your threads.</p>

        <div id="message" class="message"></div>

        <form id="loginForm" novalidate>
            {% csrf_token %}
            <div class="field">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" placeholder="janedoe" autocomplete="username" required>
            </div>

            <div class="field">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" placeholder="••••••••" autocomplete="current-password" required>
            </div>

            <button type="submit" class="submit" id="submitBtn">Sign in</button>
        </form>

        <p class="foot">Don't have an account? <a href="/register/">Create one</a></p>

    </div>
</div>

<script>
function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
    return null;
}

const form = document.getElementById('loginForm');
const messageBox = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

function clearFieldErrors() {
    form.querySelectorAll('.field-error').forEach(el => el.classList.remove('field-error'));
}

function showMessage(type, html) {
    messageBox.className = 'message show ' + type;
    messageBox.innerHTML = html;
}

function hideMessage() {
    messageBox.className = 'message';
    messageBox.innerHTML = '';
}
form.addEventListener('submit', async function (e) {
    e.preventDefault();
    hideMessage();
    clearFieldErrors();

    const payload = {
        username: document.getElementById('id_username').value.trim(),
        password: document.getElementById('id_password').value,
    };

    // ===== REQUEST =====
    console.log('=== LOGIN REQUEST ===');
    console.log('URL:', '/api/login/');
    console.log('Method: POST');
    console.log('Payload:', payload);
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';
    try {
        const response = await fetch('/api/login/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken'),
            },
            body: JSON.stringify(payload),
        });
        console.log('=== LOGIN RESPONSE ===');
        console.log('Status:', response.status, response.statusText);
        let data = {};
        try {
            data = await response.json();
            console.log('Response body:', data);
        } catch (parseErr) {
            console.error('Failed to parse JSON:', parseErr);
            showMessage('error', 'Something went wrong. Please try again.');
            return;
        }

        if (response.ok) {
            localStorage.setItem('loom_token', data.token);
            localStorage.setItem('loom_username', data.username);
            showMessage('success', 'Login successful! Redirecting…');
            setTimeout(() => {
                window.location.href = '/mainscreen/';
            }, 1000);
        } else {
            const msg = data.detail || 'Invalid username or password.';
            showMessage('error', msg);
            document.getElementById('id_username').classList.add('field-error');
            document.getElementById('id_password').classList.add('field-error');
        }
    } catch (err) {
        console.error('Network / Fetch error:', err);
        showMessage('error', 'Could not reach the server. Please check your connection and try again.');
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
    }
});
</script>

</body>
</html>
